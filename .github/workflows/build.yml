name: Forge mod build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # to publish the in-game screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Every block/item has a blockstate, model, texture, name and loot table, and no JSON
      # points at a file that doesn't exist (the cause of purple-and-black textures).
      - name: Check resources
        run: python3 tools/check_resources.py

      - name: Build
        run: |
          ./gradlew build > build.log 2>&1 || { echo "--- compiler errors:"; grep -E "error:" -A4 build.log | head -150; tail -20 build.log; exit 1; }
          tail -3 build.log

      # Boots a headless Minecraft server with the mod loaded, runs its game tests (none yet) and exits.
      # This loads all recipes, loot tables and tags, so broken data files show up here.
      - name: Load the mod in a server
        run: |
          timeout 900 ./gradlew runGameTestServer --stacktrace > gametest.log 2>&1 || {
            echo "--- data that failed to load:"
            grep -E "Errors in element|Failed to parse|No key|Unknown|not a valid|Caused by: java.lang.IllegalStateException|Missing" gametest.log \
              | grep -v "Failed to load registries" | cut -c1-600 | head -60
            exit 1; }
          tail -5 gametest.log

      - name: Check the server loaded everything
        run: |
          cp run/logs/latest.log server.log
          if grep -E "Missing (metadata|data pack).*astralend|Could not find resource pack for mod file" server.log; then
            echo "::error::astralend's resources did not load"; exit 1
          fi
          if grep -E "(WARN|ERROR).*astralend" server.log; then
            echo "::error::the server logged problems with astralend's data (see above)"; exit 1
          fi

      # Starts a real server with a fixed seed, maps the End's biomes, generates a patch of Nebula
      # Fields, counts what grew there and checks low gravity (dev/WorldgenSurvey.java).
      - name: Survey the generated End
        timeout-minutes: 15
        run: |
          echo "eula=true" > run/eula.txt
          printf "level-seed=astralend-ci\nlevel-name=survey-world\nonline-mode=false\n" > run/server.properties
          timeout 800 ./gradlew runServer -PastralendSurvey > survey-console.log 2>&1 || true
          cp run/logs/latest.log survey.log
          echo "--- server warnings and errors during the survey:"
          grep -nE "/(WARN|ERROR)\]|Exception|Caused by" survey.log | grep -v "Cache miss" | head -60 || true
          grep -n -A30 "Exception stopping the server" survey.log | head -40 || true
          echo "---"
          grep "AstralEnd survey" survey.log | sed 's/.*\[AstralEnd survey\] //' || { tail -60 survey-console.log; exit 1; }
          if grep -E "(WARN|ERROR).*astralend" survey.log; then echo "::error::the survey server logged problems with astralend"; exit 1; fi
          grep -q "SURVEY PASSED" survey.log || { echo "::error::the worldgen survey failed (see above)"; exit 1; }
          if grep -q "Exception stopping the server" survey.log; then echo "::error::the survey server crashed while stopping (the world may not have saved)"; exit 1; fi

      # Boots the real game client on a virtual screen, waits until every texture and model has
      # loaded, then fails if the game reported anything missing for this mod.
      - name: Load the mod in the real client
        if: always() && hashFiles('build/libs/*.jar') != ''
        timeout-minutes: 15
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers libvulkan1 > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true
          .github/scripts/client-check.sh

      # Opens the survey's world in the real client and photographs every astral biome, then
      # publishes the pictures to the ci-screenshots branch (browse them on GitHub).
      - name: In-game screenshots of every biome
        if: always() && hashFiles('run/survey-world/level.dat') != ''
        timeout-minutes: 20
        run: .github/scripts/screenshots.sh

      # Draws the survey's cut-outs of the biomes and structures (dev/Dioramas.java) in isometric with
      # the game's own textures, for the website. The textures stay here: only the pictures are published.
      - name: Draw the dioramas
        if: always() && hashFiles('run/dioramas/*.txt') != ''
        run: |
          pip install -q pillow
          JAR=$(find .gradle/mavenizer/repo -name 'client-extra*.jar' | head -1)
          mkdir -p /tmp/vanilla && unzip -qo "$JAR" 'assets/minecraft/textures/block/*' -d /tmp/vanilla
          mkdir -p run/screenshots
          python3 tools/dioramas/render.py run/dioramas run/screenshots src/main/resources/assets/astralend/textures/block \
            /tmp/vanilla/assets/minecraft/textures/block

      - name: Publish the screenshots
        if: always() && hashFiles('run/screenshots/astralend-*.png') != ''
        run: |
          mkdir -p /tmp/shots && cp run/screenshots/astralend-*.png /tmp/shots/
          # The survey's findings and any problems, so they can be read without the job log.
          { grep -nE "/(WARN|ERROR)\]|Exception|Caused by" survey.log | grep -v "Cache miss" | head -80; echo "---"; \
            grep "AstralEnd survey" survey.log | sed 's/.*\[AstralEnd survey\] //'; echo "---"; \
            grep -A30 "Exception stopping the server" survey.log | head -40; } > /tmp/shots/survey.txt 2>/dev/null || true
          grep -E "AstralEnd screenshots|/ERROR\]" screenshots.log 2>/dev/null | tail -80 > /tmp/shots/screenshots.txt || true
          grep -iE -A8 "experimental|lifecycle|level\.dat|Exception" screenshots.log 2>/dev/null | head -60 >> /tmp/shots/screenshots.txt || true
          cd /tmp/shots
          printf "# In-game screenshots\n\nFrom commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.\n\n" > README.md
          for f in astralend-*.png; do printf "### ${f}\n\n![](${f})\n\n" >> README.md; done
          git init -q && git checkout -q -b ci-screenshots && git add . \
            && git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screenshots from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      # Plays the scripted playtests in the real client (client/ClientPlaytests.java) and publishes a
      # contact sheet per test and the log to the ci-playtests branch.
      - name: Playtests in the real client
        if: always() && hashFiles('run/survey-world/level.dat') != '' && !contains(github.event.head_commit.message, '[trailer]')
        timeout-minutes: 25
        run: .github/scripts/playtests.sh

      - name: Publish the playtests
        if: always() && hashFiles('playtests/*.jpg') != ''
        run: |
          mkdir -p /tmp/pt && cp playtests/*.jpg /tmp/pt/
          grep "AstralEnd playtest" playtests.log | sed 's/.*\[AstralEnd playtest\] //' > /tmp/pt/playtests.txt || true
          grep -E "/ERROR\]|Exception" playtests.log | head -60 >> /tmp/pt/playtests.txt || true
          cd /tmp/pt
          printf "# Playtests\n\nFrom commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.\n\n" > README.md
          for f in *.jpg; do printf "### ${f}\n\n![](${f})\n\n" >> README.md; done
          git init -q && git checkout -q -b ci-playtests && git add . \
            && git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Playtests from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-playtests

      # Films the trailer and cuts it together (client/ClientTrailer.java, tools/trailer/), then
      # publishes it to the ci-trailer branch. Only for commits whose message says [trailer]: it takes
      # about half an hour.
      - name: Film the trailer
        if: contains(github.event.head_commit.message, '[trailer]') && hashFiles('run/survey-world/level.dat') != ''
        timeout-minutes: 100
        run: .github/scripts/trailer.sh

      - name: Publish the trailer
        if: always() && hashFiles('trailer/*.mp4') != ''
        run: |
          mkdir -p /tmp/trailer && cp -r trailer/the_astral_end_trailer.mp4 trailer/poster.png trailer/stills /tmp/trailer/
          cp trailer/teaser.webp /tmp/trailer/ 2>/dev/null || true
          grep "AstralEnd trailer" trailer.log | sed 's/.*\[AstralEnd trailer\] //' > /tmp/trailer/filming.txt || true
          cd /tmp/trailer
          printf "# The Astral End - trailer\n\nFrom commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.\n\n![](poster.png)\n\n[Watch it](the_astral_end_trailer.mp4)\n" > README.md
          git init -q && git checkout -q -b ci-trailer && git add . \
            && git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Trailer from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-trailer

      # When something fails, the logs that say why, on the ci-logs branch (readable without the job log).
      - name: Publish the logs of a failure
        if: failure()
        run: |
          mkdir -p /tmp/logs
          { grep -E "error:" -A4 build.log | head -200; echo "---"; tail -40 build.log; } > /tmp/logs/build.txt 2>/dev/null || true
          grep -E "Errors in element|Failed to parse|No key|Unknown|not a valid|Exception|Caused by|Missing|ERROR" gametest.log 2>/dev/null \
            | cut -c1-800 | head -120 > /tmp/logs/gametest.txt || true
          { grep -nE "/(WARN|ERROR)\]|Exception|Caused by" survey.log | grep -v "Cache miss" | head -80; echo "---"; \
            grep "AstralEnd survey" survey.log | sed 's/.*\[AstralEnd survey\] //'; echo "---"; tail -60 survey-console.log; } > /tmp/logs/survey.txt 2>/dev/null || true
          grep -E "ERROR|Exception|Missing|astralend" client.log 2>/dev/null | head -120 > /tmp/logs/client.txt || true
          cd /tmp/logs
          printf "# CI logs\n\nFrom commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.\n" > README.md
          git init -q && git checkout -q -b ci-logs && git add . \
            && git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Logs from ${GITHUB_SHA::7}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      # (A full artifact quota is the account's, not the build's: it doesn't fail the run.)
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: astralend
          retention-days: 3
          path: |
            build/libs/*.jar
            server.log
            survey.log
            client.log
            client-console.log
            screenshots.log
            trailer.log
            run/screenshots/astralend-*.png
          if-no-files-found: ignore
