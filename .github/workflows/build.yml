name: Forge mod build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Every block/item has a blockstate, model, texture, name and loot table, and no JSON
      # points at a file that doesn't exist (the cause of purple-and-black textures).
      - name: Check resources
        run: python3 tools/check_resources.py

      - name: API probe (temporary)
        if: hashFiles('.github/probe/probe.sh') != ''
        run: ./gradlew -q javaToolchains > /dev/null && .github/probe/probe.sh

      - name: Build
        run: ./gradlew build --stacktrace

      # Boots a headless Minecraft server with the mod loaded, runs its game tests (none yet) and exits.
      # This loads all recipes, loot tables and tags, so broken data files show up here.
      - name: Load the mod in a server
        run: timeout 900 ./gradlew runGameTestServer --stacktrace

      - name: Check the server loaded everything
        run: |
          cp run/logs/latest.log server.log
          if grep -E "Missing (metadata|data pack).*astralend|Could not find resource pack for mod file" server.log; then
            echo "::error::astralend's resources did not load"; exit 1
          fi
          if grep -E "(WARN|ERROR).*astralend" server.log; then
            echo "::error::the server logged problems with astralend's data (see above)"; exit 1
          fi

      # Starts a real server with a fixed seed, maps the End's biomes, generates a patch of Nebula
      # Fields, counts what grew there and checks low gravity (dev/WorldgenSurvey.java).
      - name: Survey the generated End
        timeout-minutes: 15
        run: |
          echo "eula=true" > run/eula.txt
          printf "level-seed=astralend-ci\nlevel-name=survey-world\nonline-mode=false\n" > run/server.properties
          timeout 800 ./gradlew runServer -PastralendSurvey > survey-console.log 2>&1 || true
          cp run/logs/latest.log survey.log
          grep "AstralEnd survey" survey.log | sed 's/.*\[AstralEnd survey\] //' || { tail -60 survey-console.log; exit 1; }
          if grep -E "(WARN|ERROR).*astralend" survey.log; then echo "::error::the survey server logged problems with astralend"; exit 1; fi
          grep -q "SURVEY PASSED" survey.log || { echo "::error::the worldgen survey failed (see above)"; exit 1; }

      # Boots the real game client on a virtual screen, waits until every texture and model has
      # loaded, then fails if the game reported anything missing for this mod.
      - name: Load the mod in the real client
        timeout-minutes: 15
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils mesa-vulkan-drivers libvulkan1 > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" glxinfo -B | grep -E "OpenGL (renderer|core profile version)" || true
          .github/scripts/client-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astralend
          path: |
            build/libs/*.jar
            server.log
            survey.log
            client.log
            client-console.log
          if-no-files-found: ignore
