name: Forge mod build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Java toolchains
        run: ./gradlew -q javaToolchains

      - name: API probe (temporary)
        if: hashFiles('.github/probe/probe.sh') != ''
        run: .github/probe/probe.sh

      - name: Build
        run: ./gradlew build --stacktrace

      # Boots a headless Minecraft server with the mod loaded, runs its game tests (none yet) and exits.
      # This is the closest thing to runClient that works without a screen.
      - name: Load the mod in a server
        run: timeout 900 ./gradlew runGameTestServer --stacktrace

      # Forge prints these when the mod's assets/ and data/ folders didn't load (no textures, recipes, loot).
      - name: Check the mod's resources loaded
        run: |
          if grep -E "Missing (metadata|data pack).*astralend|Could not find resource pack for mod file" run/logs/latest.log; then
            echo "::error::astralend's resources did not load"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astralend
          path: |
            build/libs/*.jar
            run/logs/
          if-no-files-found: ignore
