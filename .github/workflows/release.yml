name: Release to Modrinth

# Run by hand (Actions > Release to Modrinth > Run workflow). Builds the mod and publishes it with
# tools/release/modrinth.py: the first run creates the project and sends it for Modrinth's review;
# every run uploads the jar as a new version. Needs a MODRINTH_TOKEN repository secret.
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: Release channel
        type: choice
        options: [beta, alpha, release]
        default: beta
      refresh_gallery:
        description: Upload every gallery picture again (after new screenshots)
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          python3 tools/check_resources.py
          ./gradlew build > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -80; tail -20 build.log; exit 1; }
          ls -la build/libs

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          python3 tools/release/modrinth.py "$JAR" --type "${{ inputs.version_type }}" \
            ${{ inputs.refresh_gallery && '--refresh-gallery' || '' }}
