// Based on the official Forge MDK for Minecraft 26.3 (Forge 66.0.8).
// More complex examples (Access Transformers, Mixin, Jar-in-Jar): https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.0.0-beta.2'
group = 'com.ggrantrichards.astralend'

// Minecraft 26.1+ runs on Java 25, so the mod targets Java 25 too.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'astralend'
        }

        register('client') {        // ./gradlew runClient  -> launches the game with your mod
            // macOS only lets an app open windows from its first thread. The normal Minecraft
            // launcher adds this flag for Mac players; without it the game crashes with
            // "Unable to initialize SDL: No available video device".
            if (System.getProperty('os.name').toLowerCase().contains('mac'))
                jvmArgs '-XstartOnFirstThread'
            // ./gradlew runClient -PastralendScreenshots  -> opens the world the survey generated,
            // photographs every astral biome and quits. Used by CI; see dev/ClientScreenshots.java.
            if (providers.gradleProperty('astralendScreenshots').isPresent()) {
                args '--quickPlaySingleplayer', 'survey-world'
                systemProperty 'astralend.screenshots', 'true'
            }
            // ./gradlew runClient -PastralendTrailer  -> films the trailer in the survey's world, frame by
            // frame, in 720p (see client/ClientTrailer.java and tools/trailer/).
            if (providers.gradleProperty('astralendTrailer').isPresent()) {
                args '--quickPlaySingleplayer', 'survey-world', '--width', '1280', '--height', '720'
                systemProperty 'astralend.trailer', 'true'
            }
        }

        register('server') {        // ./gradlew runServer  -> launches a dedicated server
            args '--nogui'
            // ./gradlew runServer -PastralendSurvey  -> generates part of the End, prints a report
            // (biome map, block counts, gravity check) and stops. Used by CI; see dev/WorldgenSurvey.java.
            if (providers.gradleProperty('astralendSurvey').isPresent())
                systemProperty 'astralend.survey', 'true'
        }

        register('gameTestServer')

        register('data') {          // ./gradlew runData    -> data generators (advanced)
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'astralend', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    // Minecraft version - Forge version. Change these two together when updating.
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.8')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
