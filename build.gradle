// The Astral End for Minecraft 1.21.1 (Forge 52), on ForgeGradle 6. The 26.3 build lives on the
// 'textures' branch; this branch is its port.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0-beta.5-mc1.21.1'
group = 'com.ggrantrichards.astralend'
base { archivesName = 'astralend' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: '1.21.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'eventbus.api.strictRuntimeChecks', 'true'
            property 'forge.enabledGameTestNamespaces', 'astralend'
            mods { astralend { source sourceSets.main } }
        }

        client {        // ./gradlew runClient  -> launches the game with the mod
            if (System.getProperty('os.name').toLowerCase().contains('mac'))
                jvmArgs '-XstartOnFirstThread'
            // -PastralendScreenshots: opens the survey's world, photographs every astral biome and quits (CI).
            if (project.hasProperty('astralendScreenshots')) {
                args '--quickPlaySingleplayer', 'survey-world'
                property 'astralend.screenshots', 'true'
            }
            // -PastralendPlaytests: plays the scripted playtests in the survey's world (CI).
            if (project.hasProperty('astralendPlaytests')) {
                args '--quickPlaySingleplayer', 'survey-world', '--width', '1280', '--height', '720'
                property 'astralend.playtests', 'true'
            }
            // -PastralendTrailer: films the trailer in the survey's world, frame by frame, in 720p.
            if (project.hasProperty('astralendTrailer')) {
                args '--quickPlaySingleplayer', 'survey-world', '--width', '1280', '--height', '720'
                property 'astralend.trailer', 'true'
            }
        }

        server {        // ./gradlew runServer  -> a dedicated server
            args '--nogui'
            // -PastralendSurvey: generates part of the End, checks it and stops (CI; dev/WorldgenSurvey.java).
            if (project.hasProperty('astralendSurvey'))
                property 'astralend.survey', 'true'
        }

        gameTestServer {}

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'astralend', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Minecraft version - Forge version. Change these together when updating.
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']   // every error at once: CI is the only place this builds
}

// Forge 1.21.1 runs on SRG names in production: re-obfuscate the jar if this ForgeGradle offers it.
tasks.named('jar') { finalizedBy tasks.matching { it.name == 'reobfJar' } }
