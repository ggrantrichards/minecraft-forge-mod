# Tells Forge about your mod. Docs: https://docs.minecraftforge.net/en/latest/gettingstarted/modfiles/

modLoader="javafml"
loaderVersion="[66,)"
license="MIT"

[[mods]]
modId="astralend"             # must match AstralEnd.MODID; lowercase letters, numbers, underscores
version="${mod_version}"
displayName="The Astral End"
authors="ggrantrichards"
displayURL="https://modrinth.com/mod/the-astral-end"
logoFile="astralend_logo.png"
description='''The End was never empty. Beyond the dragon's island the outer End becomes a sparse sky of drifting islands: six new biomes and two caves, a Leviathan's skeleton with a citadel on its back and its Curator, creatures that live with each other, Sunstorms from the Gilded Reach's star, the Starforge, and ruins no one is left to explain.'''

[[dependencies.astralend]]
    modId="forge"
    mandatory=true
    versionRange="[66,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.astralend]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.3,26.4)"
    ordering="NONE"
    side="BOTH"
