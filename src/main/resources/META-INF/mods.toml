# Tells Forge about your mod. Docs: https://docs.minecraftforge.net/en/latest/gettingstarted/modfiles/

modLoader="javafml"
loaderVersion="[66,)"
license="MIT"

[[mods]]
modId="astralend"             # must match AstralEnd.MODID; lowercase letters, numbers, underscores
version="${mod_version}"
displayName="The Astral End"
authors="ggrantrichards"
displayURL="https://modrinth.com/mod/the-astral-end"
logoFile="astralend_logo.png"
description='''The End is alive. New biomes, creatures and structures for the outer End, including the Leviathan, the Curator and the Starforge.'''

[[dependencies.astralend]]
    modId="forge"
    mandatory=true
    versionRange="[66,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.astralend]]
    modId="minecraft"
    mandatory=true
    versionRange="[26.3,26.4)"
    ordering="NONE"
    side="BOTH"
